<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <label class="theme-switch">
    <input type="checkbox" id="theme-toggle" role="switch" />
    <span class="slider"></span>
    <span class="theme-text">Modo claro</span>
  </label>

  <h1 class="title" aria-label="Tetris">
    <span style="color:#e57373">T</span><span style="color:#ffb74d">E</span><span style="color:#ffd54f">T</span><span style="color:#81c784">R</span><span style="color:#4dd0e1">I</span><span style="color:#ba68c8">S</span>
  </h1>

  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">POWER-UP</span>
          <span class="value small" id="powerup">—</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> <kbd>Esc</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <p id="overlay-rank" class="rank-msg"></p>
        <form id="name-form" class="name-form hidden">
          <input id="name-input" type="text" maxlength="12" placeholder="Tu nombre" autocomplete="off" />
          <button type="submit" id="save-btn">Guardar</button>
        </form>
        <div id="overlay-records" class="records hidden"></div>
        <button id="restart-btn">Reiniciar</button>

        <div id="pause-menu" class="pause-menu hidden">
          <div id="pause-main" class="pause-main">
            <button id="resume-btn" class="menu-btn">Reanudar</button>
            <button id="pause-restart-btn" class="menu-btn">Reiniciar</button>
            <button id="controls-btn" class="menu-btn">Ver controles</button>
            <label class="level-select">
              <span>Nivel inicial</span>
              <select id="start-level"></select>
            </label>
          </div>
          <div id="pause-controls" class="pause-controls hidden">
            <ul>
              <li><kbd>←</kbd><kbd>→</kbd> mover</li>
              <li><kbd>↑</kbd> <kbd>X</kbd> rotar</li>
              <li><kbd>↓</kbd> bajar</li>
              <li><kbd>Space</kbd> caída</li>
              <li><kbd>P</kbd> <kbd>Esc</kbd> pausa</li>
            </ul>
            <button id="controls-back-btn" class="menu-btn">Volver</button>
          </div>
        </div>
      </div>
    </div>

    <section class="records-card" aria-label="Records">
      <div id="records" class="records"></div>
      <button id="reset-records-btn" type="button">Resetear records</button>
    </section>
  </div>

  <script src="game.js"></script>
</body>
</html>
